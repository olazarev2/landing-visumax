    <!-- Определяем язык браузера и сразу перенаправляем -->
    <script>
        (function () {
            var supported = { ru: 'ru/', ro: 'ro/', en: 'en/' };
            var lang = (navigator.language || navigator.userLanguage || 'ru').slice(0, 2).toLowerCase();
            // молдавский (mo) трактуем как румынский
            if (lang === 'mo' || lang === 'md') { lang = 'ro'; }
            var target = supported[lang] || 'ru/';
            window.location.replace('./' + target);
        })();
    </script>
    <!-- Фолбэк, если JavaScript отключён -->
    <meta http-equiv="refresh" content="0; url=./ru/">
